[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-knowledge-assistant"
version = "0.1.0"

[project.optional-dependencies]
migration = ["chromadb==1.5.9", "qdrant-client==1.19.1", "fastembed==0.8.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
