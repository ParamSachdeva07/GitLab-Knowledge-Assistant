---
- name: Chewie
  picture: chewie.jpg
  human: Richard Allan
  story: Meet Chewie, the golden-curled mastermind of mischief! This charismatic goldendoodle has perfected the art of being adorably troublesome. Chewie is part comedian, part athlete, and 100% loveable rogue who believes life is just one big game of fetch waiting to happen.
- name: Snickers
  picture: snickers.jpg
  human: Todd Kyle
  story: This is Snickers, the 8lb Cavapoo. She is a cute little furball that loves to play and be patted! She enjoys lounging in my office while I work, but especially loves our walks in the woods!
- name: Pablo
  picture: pablo.png
  human: Itzik Gan-Baruch
  story: Pablo is a super friendly Lab mix who thinks every day is the best day ever! Itzik saved him when he was tiny, and now Pablo is the happiest dog in Rosh HaAyin. He loves running around the forest near his house and thinks the dog park is basically Disney World for dogs. Pablo is still learning not to nibble on everything (including people), but he is just so excited about life that his tail never stops wagging!
- name: Lucky
  picture: lucky.jpg
  human: Keith Mattes
  story: This is Lucky, the 32lb mini Bernadoodle with a bark bigger than his smile and love for walks and his hoo-mans! Lucky also shares a passsion for making beds! If by making you mean getting underneath everything and pretending he's in a cave or tunnel, then you are correct! When he's not working on his linen-game, he's loafing behind his dad in an oversized pillow in the sun :)
- name: Turk Turk
  picture: turkturk.png
  human: Lauren Barker
  story: Turk Turk will make you tremble in your boots if you set foot in his yard. Moving faster than the unsuspecting elephant seal, he will bolt from underneath the apple tree when your snagging the forbidden avocados in a flying waddle with talons out. It's moments like these you question the decisions that got you here. You've been warned. Don't mess with Turk Turk or his avocados on E st.
- name: Lady Pug
  picture: ladypug.png
  human: Davis Bickford
  story: Lady Pug is a sweet girl who loves treats, naps and cuddles. She's a world-class sprinter, and was <a href="https://www.reddit.com/r/aww/comments/3pjmox/pugs_first_time_at_the_dog_park/"> famous for a day</a> because she's such a fast pug. She will sit on your lap, you really don't have a choice in this.
- name: Idgie
  picture: idgiepug.png
  human: Davis Bickford
  story: Idgie is a pug / american bulldog mix who loves playing with toys, eating leaves, and cuddling on laps. She's especially skillful at spinning in circles, annoying her sister pug, Lady, and scaring away squirrels who didn't do anything remotely deserving of her sassy 'tude.
- name: Daphne Conrad
  picture: daphne.jpg
  human: Justin Conrad
  story: Daphne is a cavachon who lives in Cork, Ireland. Daphne loves nothing more than eating - especially salmon, meatballs & spaghetti! She passes her time chasing birds in the garden, barking at the neighbours dog & lounging in front of the stove.
- name: Roscoe and Nikita
  picture: nikitaandroscoe.jpeg
  human: Aleesha Dawson
  story: Nikita is a husky who adopted Aleesha as her human in 2010 when Nikita was just 11 weeks old and Aleesha was just 18 years old. She is the laziest, chillest husky you will ever met. She likes to chase birds and rabbits and weirdly loves sunbathing. Roscoe adopted Aleesha and her husband Eric in 2015. He is a ball of anxiety, and loves his sister and parents very much. He likes to sleep on his back and bark non-stop.
- name: Cleo and Oskar
  picture: oskarandcleo.jpeg
  human: Aleesha Dawson
  story: Oskar adopted his humans Aleesha and Eric in 2018 when he was just a couple months old. He likes opening and closing doors, drinking from faucets, and looking at you like he's really angry. Cleo joined the family in 2021 at just a few months old. She likes running around the house, sleeping in anyone else's bed, eating, trying to run outside, and just being a general trouble maker.
- name: Hagrid
  picture: hagrid.jpg
  human: Jason Shippee
  story: Hagrid is a big floofy gentle giant Sheepadood who joined our family in 2020 at the beginning of Covid. His best friend is his little brother (Human), who's only 1 year younger than him. He likes playing paper, rock, scissors (he always goes with paper), playing sneak and being a good boy offleash at all the parks and trails.
- name: CC
  picture: cc.jpg
  human: Chris Stone
  story: CC (Chris's Cat) adopted us when we were living in London. She used to stop by every day and I guess we grew on her so she decided to stay! A bit of a nutcase but then most Calicos are I'm told!
- name: Tuna
  picture: tuna.jpg
  human: Tiffany Rea
  story: Highly skilled stuffed mouse hunter, laser point chaser, butt wiggler, but most of all a very gentle, well-mannered little kitty. Loves food, treats, pets and napping. Yet does not beg for food nor pets, but will sit patiently and stare deep into your soul until you decide to do the right thing - with cheesecake being an exception!
- name: Fibi
  picture: fibi.jpg
  human: Martin Berka
  story: Fibi is a mix of Labrador and Poodle - a Labradoodle. She has all the positive qualities of these two breeds, is very child and family friendly and has become an important part of the family. In addition to attention, she also needs regular walks and thus forces us in a positive way to go out in all wind and weather, to take breaks from work which is very important especially with a 100% home office job!
- name: Charley
  picture: charley.jpg
  human: Sandra Gittlen
  story: Charley is the sweetest chocolate Lab around and loves her sniffaris around the neighborhood.
- name: Aurora
  picture: aurora.jpg
  human: Pavel Shutsin
  story: Aurora is a Scottish cat who owns 2 human pets. As any good master she is constantly somewhere nearby to help her human pets with finishing tuna steak or defend against pesky birds. Aurora as her name stands for is the first thingy you'll see in the morning in her house.
- name: Bruno
  picture: bruno.jpg
  human: Mario Mora
  story: Without knowing if it is actually a bull or a dog, Bruno enjoys to take its human for a walk every couple of days or so. He also likes to play with its plastic ball and loves to catch it on the fly. While very protective at home; he is friendly with anyone that is outside the house and enjoys to be pet by anyone.
- name: Ripley
  picture: ripleyjr.png
  human: Jesse Rabbits
  story: Ripley is a bright eyed, playful, 6-year-old rescue. He is affectionately known as Mr. Cheese.
- name: Auto
  picture: auto.jpg
  human: Vaidehi(Vee) Purohit
  story: Auto is a border collie mix. He is 7-year-old rescue, loves to run and chase people out the door. Best guard dog anyone could ever ask for.
- name: Annie and Ruby
  picture: annieandruby.jpg
  human: Stephen Walters
  story: Annie is a laid back Golden Retriever, always wanting a fuss. Ruby is a Red Fox Labrador and a complete livewire, always wanting food, to play and very protective, especially of our 2 year old granddaughter who they love.
- name: Humpf
  picture: humpf.jpg
  story: Well-trained black lab with a love for carrots and naps.
- name: Fifille and Lola
  picture: fifille-lola.jpg
  human: Christian Couder
  story: Fifille and Lola are very fearful guinea pigs, unless you approach them with cucumber slices.
- name: CMYK
  picture: cmyk.jpg
  human: André Luís
  story: CMYK is a rescued unknown-mix mutt and proud of it. He thinks he is as huge as a Great Dane and as handsome as a Husky. He's the size of a Chihuahua so one out of two isn't that bad. Loves basking in the sun and will use you as a heated pillow every chance he gets.
- name: Spirit
  picture: spirit.jpg
  human: Dennis Tang
  story: Spirit is a rescued Chihuahua/Corgi mix that's the size of a Chihuahua but looks like a Corgi. He's an expert in extreme cuddling, begging for food, and being half-interested in playing with toys. In his spare time, he likes to take up all the space on the sofa or bed, also lick arms, and beg for more food.
